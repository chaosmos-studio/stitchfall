# The workflows pin every action to a commit. Dependabot proposes the newer commits once a month, so pinning
# never means staying on an old version.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
