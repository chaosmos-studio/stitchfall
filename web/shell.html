<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="palewheel-version" content="1">
<meta name="theme-color" content="#f7f8f5">
<link rel="icon" href="data:,">
<title>Palewheel | Chaosmos</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f8f5;color:#17262d;font:16px system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f7f8f5 0%,#d9e6e8 55%,#18c9df 100%);text-align:center;padding:24px}
#loading[hidden]{display:none}
h1{font-size:32px;letter-spacing:.12em;margin:0 0 20px}
progress{width:min(240px,80vw);height:8px;accent-color:#f46b42}
#error{max-width:28em;white-space:pre-wrap}
button{border:3px solid #17262d;background:#f46b42;color:#17262d;padding:12px 20px;font:700 16px system-ui,sans-serif}
#rotate{display:none;position:fixed;inset:0;align-items:center;justify-content:center;padding:32px;background:#f7f8f5;color:#17262d;text-align:center;font-size:22px;z-index:3}
@media (orientation:portrait){#rotate{display:flex}}
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas" tabindex="0" aria-label="Palewheel. Move with A and D or the arrow keys, jump with W or Space, crouch with S, and turn gravity with Shift or a click. On touchscreens, slide to move, swipe up to jump, swipe down to crouch, and tap to turn gravity.">Canvas is required to play Palewheel.</canvas>
<div id="rotate">Turn your phone sideways to play Palewheel.</div>
<div id="loading" role="status"><div><h1>PALEWHEEL</h1><p id="status">Starting the engine...</p><progress id="progress" max="1" value="0"></progress><p id="error"></p><button id="retry" hidden onclick="location.reload()">Try again</button></div></div>
<noscript>Enable JavaScript to play Palewheel.</noscript>
<script src="wasm-loader.js"></script>
<script src="$GODOT_URL"></script>
<script>
const engine = new Engine($GODOT_CONFIG);
const loading = document.getElementById('loading');
function fail(error) {
  document.getElementById('status').textContent = 'The engine could not start.';
  document.getElementById('error').textContent = String(error);
  document.getElementById('progress').hidden = true;
  document.getElementById('retry').hidden = false;
}
const missing = Engine.getMissingFeatures({threads: false});
if (missing.length) {
  fail('This browser needs WebGL 2 and WebAssembly: ' + missing.join(', '));
} else {
  engine.startGame({canvas: document.getElementById('canvas'), onProgress: (current, total) => {
    if (total > 0) document.getElementById('progress').value = current / total;
  }}).then(() => { loading.hidden = true; document.getElementById('canvas').focus(); }).catch(fail);
}
</script>
</body>
</html>
